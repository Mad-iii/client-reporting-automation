agency:
  name: "Northlake Media"
  tagline: "Weekly Performance Report"
  from_email: "reports@northlake.example"
  dashboard_base_url: "https://USERNAME.github.io/REPO/whitelabel"
  demo_notice: "DEMO: fictional clients and synthetic data"
  # logo_file: "brand2_logo.png"      # optional: use a real PNG instead of the generated logo
  colors:
    primary: "#3A1C4C"
    accent: "#0E8A8F"
    ink: "#201A26"
    good: "#2F7D5B"
    bad: "#B3402E"
    muted: "#6E6A75"
    rule: "#E3D9DE"
    paper: "#FBF8F9"
    light: "#F4EEF2"

llm:
  providers: ["openrouter", "template"]   # tried in order; template always works
  openrouter_models:                                  # free models rotate, check openrouter.ai/models?q=free
    - "google/gemma-4-31b-it:free"
    - "google/gemma-4-26b-a4b-it:free"
    - "nvidia/nemotron-3-super-120b-a12b:free"
    - "openrouter/free"
  ollama_model: "llama3.2:3b"
  timeout: 60

email:
  mode: "eml"    # "eml" = save .eml files (no account needed) | "gmail" = send via Gmail app password

