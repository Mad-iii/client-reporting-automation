agency:
  name: "Brightline Digital"
  tagline: "Weekly Performance Report"
  from_email: "reports@brightline.example"
  dashboard_base_url: ""     # e.g. https://yourname.github.io/reports ; empty = local file link
  colors:
    primary: "#0F2A43"     # deep navy
    accent: "#C9822B"      # muted copper
    ink: "#1B2430"         # body text
    good: "#2F7D5B"
    bad: "#B3402E"
    muted: "#6B7280"
    rule: "#DDD8CC"        # hairlines
    paper: "#FAF8F4"       # page background (web, email)
    light: "#F3F0E9"

llm:
  providers: ["openrouter", "template"]   # tried in order; template always works
  openrouter_models:                                  # free models rotate, check openrouter.ai/models?q=free
    - "google/gemma-4-31b-it:free"
    - "google/gemma-4-26b-a4b-it:free"
    - "nvidia/nemotron-3-super-120b-a12b:free"
    - "openrouter/free"
  ollama_model: "llama3.2:3b"
  timeout: 60

email:
  mode: "eml"    # "eml" = save .eml files (no account needed) | "gmail" = send via Gmail app password

clients:
